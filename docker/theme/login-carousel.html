<style>
/* Carrusel de fotos del campus detrás del panel "Le damos la bienvenida" del login. */
body.pagelayout-login .login-layout-left { overflow: hidden; }
body.pagelayout-login .login-layout-left-content { position: relative; z-index: 1; }
.aurora-carousel { position: absolute; inset: 0; z-index: 0; }
.aurora-slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transform: scale(1.04);
    transition: opacity 1.2s ease-in-out, transform 7s ease-out;
}
.aurora-slide.is-active { opacity: 1; transform: scale(1); }
.aurora-carousel-dots {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 1.5rem;
    z-index: 2;
    display: flex;
    justify-content: center;
    gap: .5rem;
}
.aurora-carousel-dots button {
    width: 10px;
    height: 10px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .5);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .4);
    cursor: pointer;
    transition: background-color .2s, width .2s;
}
.aurora-carousel-dots button[aria-current="true"] { width: 26px; border-radius: 5px; background: #fff; }
.aurora-carousel-dots button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
    .aurora-slide { transition: none; transform: none; }
}
</style>
<script>
(function () {
    var panel = document.querySelector('body.pagelayout-login .login-layout-left');
    if (!panel) {
        return;
    }
    var root = (window.M && M.cfg && M.cfg.wwwroot) || '';
    // Fotos en public/banner/web (copias de 1600 px de las originales). pos = encuadre en el panel vertical.
    var slides = [
        {src: '/banner/web/banner1.jpg', pos: 'center'},
        {src: '/banner/web/banner2.jpg', pos: 'center'},
        {src: '/banner/web/banner3.jpg', pos: 'center 80%'},
        {src: '/banner/web/banner4.jpg', pos: '40% center'}
    ];
    var interval = 6000;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var wrap = document.createElement('div');
    var dots = document.createElement('div');
    var items = [];
    var buttons = [];
    var current = 0;
    var timer = null;

    wrap.className = 'aurora-carousel';
    wrap.setAttribute('aria-hidden', 'true');
    dots.className = 'aurora-carousel-dots';

    function show(index) {
        items[current].classList.remove('is-active');
        buttons[current].removeAttribute('aria-current');
        current = index;
        items[current].classList.add('is-active');
        buttons[current].setAttribute('aria-current', 'true');
    }

    function restart() {
        clearInterval(timer);
        if (!reduce && !document.hidden) {
            timer = setInterval(function () {
                show((current + 1) % items.length);
            }, interval);
        }
    }

    slides.forEach(function (slide, i) {
        var item = document.createElement('div');
        item.className = 'aurora-slide';
        item.style.backgroundImage = 'url("' + root + slide.src + '")';
        item.style.backgroundPosition = slide.pos;
        wrap.appendChild(item);
        items.push(item);

        var button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('aria-label', 'Mostrar foto ' + (i + 1) + ' de ' + slides.length);
        button.addEventListener('click', function () {
            show(i);
            restart();
        });
        dots.appendChild(button);
        buttons.push(button);
    });

    panel.insertBefore(wrap, panel.firstChild);
    panel.appendChild(dots);
    items[0].classList.add('is-active');
    buttons[0].setAttribute('aria-current', 'true');
    restart();
    document.addEventListener('visibilitychange', restart);
})();
</script>
